name: CI

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "ci/trigger"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Make sure clang is available
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Record toolchain
        run: |
          mkdir -p ci/logs ci/out
          {
            rustc --version
            cargo --version
            echo "clang path: $(command -v clang || echo missing)"
            clang --version || true
            ls -l target/release/archx || true
          } | tee ci/logs/toolchain.log

      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ci/logs/test.log

      - name: Build release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ci/logs/build.log

      - name: Run examples
        run: |
          mkdir -p ci/out ci/logs
          set +e
          (
            fail=0
            for name in hello functions if loops arrays structs_regions; do
              echo "== emit-ir: $name =="
              ./target/release/archx "examples/$name.archx.lang" --emit-ir > "ci/out/$name.ll"
              code=$?
              echo "exit=$code"
              [ "$code" -ne 0 ] && fail=1

              echo "== compile: $name =="
              ./target/release/archx "examples/$name.archx.lang" -o "/tmp/archx-$name" > "ci/logs/compile-$name.log" 2>&1
              code=$?
              echo "exit=$code"
              cat "ci/logs/compile-$name.log"
              [ "$code" -ne 0 ] && fail=1

              echo "== run: $name =="
              if [ -x "/tmp/archx-$name" ]; then
                "/tmp/archx-$name" > "ci/out/$name.txt"
                code=$?
                echo "exit=$code"
                cat "ci/out/$name.txt"
                [ "$code" -ne 0 ] && fail=1
              else
                echo "binary missing"
                fail=1
              fi
            done

            echo "== optimized IR (clang -O2) =="
            for name in hello functions if loops arrays structs_regions; do
              clang -O2 -Wno-override-module -S -emit-llvm "ci/out/$name.ll" -o "ci/out/$name.opt.ll"
              code=$?
              echo "$name.opt.ll exit=$code"
              [ "$code" -ne 0 ] && fail=1
            done

            exit "$fail"
          ) > ci/logs/examples.log 2>&1
          status=$?
          cat ci/logs/examples.log
          exit "$status"

      - name: Verify zero memory leaks & memory safety (ASan + LSan)
        run: |
          set -euo pipefail
          for target in examples/arrays.archx.lang examples/structs_regions.archx.lang benchmarks/composite.archx.lang; do
            echo "== ASan + LSan check: $target =="
            ./target/release/archx "$target" --emit-ir > /tmp/asan_target.ll
            clang -O1 -g -fsanitize=address,leak -fno-omit-frame-pointer -Wno-override-module /tmp/asan_target.ll -o /tmp/asan_target
            ASAN_OPTIONS=detect_leaks=1 /tmp/asan_target > /dev/null
            echo "CLEAN: $target (0 leaks, 0 invalid accesses)"
          done 2>&1 | tee ci/logs/asan_lsan.log

      - name: Benchmark against C and Rust
        run: |
          set -o pipefail
          ./target/release/archx benchmarks/arrays.archx.lang --emit-ir > /tmp/bench_arrays.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_arrays.ll -o ci/out/bench_arrays.opt.ll
          clang -O2 -S -emit-llvm benchmarks/arrays_raw.c -o ci/out/bench_arrays_c_raw.opt.ll
          ./target/release/archx benchmarks/composite.archx.lang --emit-ir > /tmp/bench_composite.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_composite.ll -o ci/out/bench_composite.opt.ll
          clang -O2 -S -emit-llvm benchmarks/composite.c -o ci/out/bench_composite_c.opt.ll
          bash benchmarks/run.sh 7 2>&1 | tee ci/logs/benchmarks.log

      - name: Save CI output to the repo
        if: always()
        run: |
          git config user.name "archx-ci"
          git config user.email "ci@archx.local"
          git add ci/logs ci/out
          if git diff --cached --quiet; then
            echo "No new CI output to commit."
          else
            git commit -m "ci: update logs and outputs for ${GITHUB_SHA::7}"
            git push origin HEAD:"$GITHUB_REF_NAME" || echo "push failed (branch may have moved)"
          fi
