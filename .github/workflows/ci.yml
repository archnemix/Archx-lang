# GitHub Actions CI pipeline: runs unit & integration tests across Linux, macOS, and Windows (3 runners <= 5 cap),
# verifies ASan+LSan zero-leak safety, runs 7-suite Python 3 / C / Rust / Archx benchmarks, and commits logs + versioned test history into `ci/`.

name: CI

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "ci/trigger"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Make sure clang is available
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Record toolchain
        run: |
          mkdir -p ci/logs ci/out
          {
            rustc --version
            cargo --version
            python3 --version || true
            echo "clang path: $(command -v clang || echo missing)"
            clang --version || true
            # LLVM's own version, which is what decides which passes and attributes exist. Archx's
            # optimisation story is pinned to this, so record it next to the clang that consumes the IR.
            clang -print-prog-name=opt >/dev/null 2>&1 || true
            echo "clang default target: $(clang -dumpmachine 2>/dev/null || echo unknown)"
          } | tee ci/logs/toolchain.log

      - name: Reject committed binaries (AX-005)
        # The tree once carried six executables (`bw`, `d1`, `hello`, …) because local build output was
        # committed by accident. The check reads the magic number of every *tracked* blob, so it works
        # without `file(1)` and cannot be fooled by a missing extension.
        run: python3 tools/check_binaries.py

      - name: Reject stale README numbers (AX-003)
        # The README quotes the benchmark table and the test count; both were stale for several
        # releases because nothing compared them against the artifacts that produce them.
        run: |
          python3 tools/sync_readme_benchmarks.py --check
          python3 tools/check_test_count.py
          python3 tools/gen_limitations.py --check
          # The code registry is rendered from the compiler itself, so build before checking it.
          cargo build --quiet
          python3 tools/gen_error_codes.py --check
          python3 tools/gen_dialect_matrix.py --check

      - name: Reject a stale work-order tracker (AX-000)
        run: python3 tools/gen_tracker.py --check

      - name: Reject compiler warnings (AX-004)
        # AX-004: a warning is a defect that has not been triaged yet. Gating on `-D warnings` keeps
        # the count at zero instead of letting it drift back up between releases.
        run: |
          set -o pipefail
          RUSTFLAGS="-D warnings" cargo build --all-targets 2>&1 | tee ci/logs/warnings.log

      - name: Unit & integration tests (Linux)
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee ci/logs/test.log

      - name: Conformance vs CPython (AX-007)
        # Every probe in tests/conformance/ is one file that is legal Python and legal Archx: the same
        # bytes are executed by python3 and compiled by archx, and stdout must match byte for byte. A
        # divergence has to be marked `# conformance: xfail <reason>` in the probe, so a gap is
        # documented rather than quietly tolerated (docs/LIMITATIONS.md is generated from the same data).
        run: |
          set -o pipefail
          cargo build 2>&1 | tee -a ci/logs/build.log
          cargo test --test conformance -- --nocapture 2>&1 | tee ci/logs/conformance.log

      - name: Build release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ci/logs/build.log

      - name: Verify builds are reproducible (AX-012)
        # Two clean compilations must agree byte for byte: emitted IR, the linked binary, and the
        # program's stdout/stderr. This is the gate that keeps hash-map iteration order, temp paths and
        # timestamps out of the output, so an optimization change can be judged on measurements.
        run: |
          set -o pipefail
          ci/reproducibility.sh ./target/release/archx 2>&1 | tee ci/logs/reproducibility.log

      - name: Verify every emitted IR module parses and verifies (AX-009)
        # Two v0.9.1 bugs (a `%` phi missing a predecessor and the `%ArchxAny` binop dispatch) were
        # ill-formed IR that `clang` only reported when a program exercised that path. This gate feeds
        # every example and benchmark to a real LLVM frontend, so the emitting file is named instead.
        run: |
          set -o pipefail
          bash ci/verify_ir.sh ./target/release/archx 2>&1 | tee ci/logs/verify_ir.log

      - name: Run examples & emit optimized IR
        run: |
          mkdir -p ci/out ci/logs
          set +e
          (
            fail=0
            for name in hello functions if loops arrays structs_regions pythonic collections_dynamic enums_matching; do
              echo "== emit-ir: $name =="
              ./target/release/archx "examples/$name.archx.lang" --emit-ir > "ci/out/$name.ll"
              code=$?
              echo "exit=$code"
              [ "$code" -ne 0 ] && fail=1

              echo "== compile: $name =="
              ./target/release/archx "examples/$name.archx.lang" -o "/tmp/archx-$name" > "ci/logs/compile-$name.log" 2>&1
              code=$?
              echo "exit=$code"
              cat "ci/logs/compile-$name.log"
              [ "$code" -ne 0 ] && fail=1

              echo "== run: $name =="
              if [ -x "/tmp/archx-$name" ]; then
                "/tmp/archx-$name" > "ci/out/$name.txt"
                code=$?
                echo "exit=$code"
                cat "ci/out/$name.txt"
                [ "$code" -ne 0 ] && fail=1
              else
                echo "binary missing"
                fail=1
              fi
            done

            echo "== optimized IR (clang -O2) =="
            for name in hello functions if loops arrays structs_regions pythonic collections_dynamic enums_matching; do
              clang -O2 -Wno-override-module -S -emit-llvm "ci/out/$name.ll" -o "ci/out/$name.opt.ll"
              code=$?
              echo "$name.opt.ll exit=$code"
              [ "$code" -ne 0 ] && fail=1
            done

            exit "$fail"
          ) > ci/logs/examples.log 2>&1
          status=$?
          cat ci/logs/examples.log
          exit "$status"

      - name: Verify zero memory leaks & memory safety (ASan + LSan)
        run: |
          set -euo pipefail
          for target in examples/arrays.archx.lang examples/structs_regions.archx.lang examples/pythonic.archx.lang examples/collections_dynamic.archx.lang examples/enums_matching.archx.lang examples/comparison/full_tour_pythonic.archx.lang examples/comparison/full_tour_speed.archx.lang benchmarks/composite.archx.lang benchmarks/nbody_float.archx.lang benchmarks/dict_bench.archx.lang benchmarks/dict_dynamic.archx.lang; do
            echo "== ASan + LSan check: $target =="
            ./target/release/archx "$target" --emit-ir > /tmp/asan_target.ll
            clang -O1 -g -fsanitize=address,leak -fno-omit-frame-pointer -Wno-override-module /tmp/asan_target.ll -lm -o /tmp/asan_target
            ASAN_OPTIONS=detect_leaks=1 /tmp/asan_target > /dev/null
            echo "CLEAN: $target (0 leaks, 0 invalid accesses)"
          done 2>&1 | tee ci/logs/asan_lsan.log

      - name: Verify zero live allocations (independent leak gate)
        # `--wrap` is a GNU ld / lld feature; ld64 does not implement it. The job already runs on a
        # Linux runner, so this is a guard against the step being moved somewhere it cannot work --
        # a leak gate that silently cannot run must not look like a pass.
        if: runner.os != 'macOS'
        run: |
          set -euo pipefail
          # The ASan/LSan step above covers invalid accesses and is the primary check. This gate
          # exists because ASan's runtime does not link against Archx IR on every toolchain, and a
          # leak check that cannot run must not look like a pass. `ci/leakcheck.c` wraps the
          # allocator and fails the build if the program still owns any block at exit.
          for target in examples/arrays.archx.lang examples/structs_regions.archx.lang examples/pythonic.archx.lang examples/collections_dynamic.archx.lang examples/enums_matching.archx.lang examples/comparison/full_tour_pythonic.archx.lang examples/comparison/full_tour_speed.archx.lang benchmarks/composite.archx.lang benchmarks/nbody_float.archx.lang benchmarks/dict_bench.archx.lang benchmarks/dict_dynamic.archx.lang benchmarks/pipelines.archx.lang; do
            echo "== leak check: $target =="
            ./target/release/archx "$target" --emit-ir > /tmp/leak_target.ll
            ${CC:-clang} -O1 -Wno-override-module /tmp/leak_target.ll ci/leakcheck.c \
              -Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=realloc -Wl,--wrap=free \
              -lm -o /tmp/leak_target
            /tmp/leak_target > /dev/null
            echo "CLEAN: $target (0 live blocks)"
          done 2>&1 | tee ci/logs/leakcheck.log

      - name: Benchmark against Python 3, C, and Rust
        run: |
          set -o pipefail
          ./target/release/archx benchmarks/arrays.archx.lang --emit-ir > /tmp/bench_arrays.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_arrays.ll -o ci/out/bench_arrays.opt.ll
          clang -O2 -S -emit-llvm benchmarks/arrays_raw.c -o ci/out/bench_arrays_c_raw.opt.ll
          ./target/release/archx benchmarks/composite.archx.lang --emit-ir > /tmp/bench_composite.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_composite.ll -o ci/out/bench_composite.opt.ll
          clang -O2 -S -emit-llvm benchmarks/composite.c -o ci/out/bench_composite_c.opt.ll
          ./target/release/archx benchmarks/nbody_float.archx.lang --emit-ir > /tmp/bench_nbody_float.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_nbody_float.ll -o ci/out/bench_nbody_float.opt.ll
          clang -O2 -S -emit-llvm benchmarks/nbody_float.c -o ci/out/bench_nbody_float_c.opt.ll
          ./target/release/archx benchmarks/dict_bench.archx.lang --emit-ir > /tmp/bench_dict.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_dict.ll -o ci/out/bench_dict.opt.ll
          clang -O2 -S -emit-llvm benchmarks/dict_bench.c -o ci/out/bench_dict_c.opt.ll
          ./target/release/archx examples/comparison/full_tour_speed.archx.lang --emit-ir > /tmp/bench_full_tour.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_full_tour.ll -o ci/out/bench_full_tour.opt.ll
          bash benchmarks/run.sh 7 3 2>&1 | tee ci/logs/benchmarks.log

      - name: Stage Linux CI outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: |
            ci/logs/**
            ci/out/**

  cross-platform-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure clang is on PATH (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          elif ! command -v clang >/dev/null 2>&1; then
            choco install llvm -y
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          fi

      - name: Run unit & CLI integration tests (${{ matrix.label }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-xplat
          {
            echo "OS: ${{ matrix.os }}"
            rustc --version
            cargo --version
            clang --version || true
            echo "--- warning gate ---"
            RUSTFLAGS="-D warnings" cargo build --all-targets
            echo "--- cargo test ---"
            cargo test
          } 2>&1 | tee "ci-xplat/${{ matrix.label }}-test.log"

      - name: Stage ${{ matrix.label }} test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.label }}
          path: ci-xplat/${{ matrix.label }}-test.log

  save-ci-records:
    needs: [build-and-test, cross-platform-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect Linux, macOS, and Windows outputs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ci-collected

      - name: Save logs, outputs, and versioned test history (retaining latest 3 versions)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          VDIR="ci/test-history/v${VERSION}"
          mkdir -p ci/logs ci/out "$VDIR"

          if [ -d /tmp/ci-collected/ci-linux ]; then
            cp -r /tmp/ci-collected/ci-linux/logs/* ci/logs/ 2>/dev/null || true
            cp -r /tmp/ci-collected/ci-linux/out/* ci/out/ 2>/dev/null || true
            cp -r /tmp/ci-collected/ci-linux/ci/logs/* ci/logs/ 2>/dev/null || true
            cp -r /tmp/ci-collected/ci-linux/ci/out/* ci/out/ 2>/dev/null || true
            cp ci/logs/test.log "$VDIR/linux-test.log" 2>/dev/null || true
          fi
          if [ -f /tmp/ci-collected/ci-macos/macos-test.log ]; then
            cp /tmp/ci-collected/ci-macos/macos-test.log "$VDIR/macos-test.log"
          fi
          if [ -f /tmp/ci-collected/ci-windows/windows-test.log ]; then
            cp /tmp/ci-collected/ci-windows/windows-test.log "$VDIR/windows-test.log"
          fi

          # Retain at most the latest 3 version directories (previous 2 + current):
          ls -1dt ci/test-history/v* 2>/dev/null | tail -n +4 | xargs -r rm -rf

          # The README table is generated from the report this job is about to commit, so regenerate it
          # here: otherwise each benchmark run would leave the README stale for the next run's check.
          python3 tools/sync_readme_benchmarks.py || true

          git config user.name "archx-ci"
          git config user.email "ci@archx.local"
          git add ci/logs ci/out ci/test-history README.md
          if git diff --cached --quiet; then
            echo "No new CI output to commit."
          else
            git commit -m "ci: update Linux/macOS/Windows logs and test history for ${GITHUB_SHA::7}"
            git push origin HEAD:"$GITHUB_REF_NAME" || echo "push failed (branch may have moved)"
          fi
