# GitHub Actions CI pipeline: runs unit & integration tests across Linux, macOS, and Windows (3 runners <= 5 cap),
# verifies ASan+LSan zero-leak safety, runs 3-suite C/Rust/Archx benchmarks, and commits logs + versioned test history into `ci/`.

name: CI

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "ci/trigger"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Make sure clang is available
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Record toolchain
        run: |
          mkdir -p ci/logs ci/out
          {
            rustc --version
            cargo --version
            echo "clang path: $(command -v clang || echo missing)"
            clang --version || true
          } | tee ci/logs/toolchain.log

      - name: Unit & integration tests (Linux)
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee ci/logs/test.log

      - name: Build release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ci/logs/build.log

      - name: Run examples & emit optimized IR
        run: |
          mkdir -p ci/out ci/logs
          set +e
          (
            fail=0
            for name in hello functions if loops arrays structs_regions; do
              echo "== emit-ir: $name =="
              ./target/release/archx "examples/$name.archx.lang" --emit-ir > "ci/out/$name.ll"
              code=$?
              echo "exit=$code"
              [ "$code" -ne 0 ] && fail=1

              echo "== compile: $name =="
              ./target/release/archx "examples/$name.archx.lang" -o "/tmp/archx-$name" > "ci/logs/compile-$name.log" 2>&1
              code=$?
              echo "exit=$code"
              cat "ci/logs/compile-$name.log"
              [ "$code" -ne 0 ] && fail=1

              echo "== run: $name =="
              if [ -x "/tmp/archx-$name" ]; then
                "/tmp/archx-$name" > "ci/out/$name.txt"
                code=$?
                echo "exit=$code"
                cat "ci/out/$name.txt"
                [ "$code" -ne 0 ] && fail=1
              else
                echo "binary missing"
                fail=1
              fi
            done

            echo "== optimized IR (clang -O2) =="
            for name in hello functions if loops arrays structs_regions; do
              clang -O2 -Wno-override-module -S -emit-llvm "ci/out/$name.ll" -o "ci/out/$name.opt.ll"
              code=$?
              echo "$name.opt.ll exit=$code"
              [ "$code" -ne 0 ] && fail=1
            done

            exit "$fail"
          ) > ci/logs/examples.log 2>&1
          status=$?
          cat ci/logs/examples.log
          exit "$status"

      - name: Verify zero memory leaks & memory safety (ASan + LSan)
        run: |
          set -euo pipefail
          for target in examples/arrays.archx.lang examples/structs_regions.archx.lang benchmarks/composite.archx.lang; do
            echo "== ASan + LSan check: $target =="
            ./target/release/archx "$target" --emit-ir > /tmp/asan_target.ll
            clang -O1 -g -fsanitize=address,leak -fno-omit-frame-pointer -Wno-override-module /tmp/asan_target.ll -o /tmp/asan_target
            ASAN_OPTIONS=detect_leaks=1 /tmp/asan_target > /dev/null
            echo "CLEAN: $target (0 leaks, 0 invalid accesses)"
          done 2>&1 | tee ci/logs/asan_lsan.log

      - name: Benchmark against C and Rust
        run: |
          set -o pipefail
          ./target/release/archx benchmarks/arrays.archx.lang --emit-ir > /tmp/bench_arrays.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_arrays.ll -o ci/out/bench_arrays.opt.ll
          clang -O2 -S -emit-llvm benchmarks/arrays_raw.c -o ci/out/bench_arrays_c_raw.opt.ll
          ./target/release/archx benchmarks/composite.archx.lang --emit-ir > /tmp/bench_composite.ll
          clang -O2 -Wno-override-module -S -emit-llvm /tmp/bench_composite.ll -o ci/out/bench_composite.opt.ll
          clang -O2 -S -emit-llvm benchmarks/composite.c -o ci/out/bench_composite_c.opt.ll
          bash benchmarks/run.sh 7 2>&1 | tee ci/logs/benchmarks.log

      - name: Stage Linux CI outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: |
            ci/logs/**
            ci/out/**

  cross-platform-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure clang is on PATH (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          elif ! command -v clang >/dev/null 2>&1; then
            choco install llvm -y
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          fi

      - name: Run unit & CLI integration tests (${{ matrix.label }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-xplat
          {
            echo "OS: ${{ matrix.os }}"
            rustc --version
            cargo --version
            clang --version || true
            echo "--- cargo test ---"
            cargo test
          } 2>&1 | tee "ci-xplat/${{ matrix.label }}-test.log"

      - name: Stage ${{ matrix.label }} test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.label }}
          path: ci-xplat/${{ matrix.label }}-test.log

  save-ci-records:
    needs: [build-and-test, cross-platform-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect Linux, macOS, and Windows outputs
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ci-collected

      - name: Save logs, outputs, and versioned test history (retaining latest 3 versions)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          VDIR="ci/test-history/v${VERSION}"
          mkdir -p ci/logs ci/out "$VDIR"

          if [ -d /tmp/ci-collected/ci-linux ]; then
            cp -r /tmp/ci-collected/ci-linux/ci/logs/* ci/logs/ 2>/dev/null || true
            cp -r /tmp/ci-collected/ci-linux/ci/out/* ci/out/ 2>/dev/null || true
            cp ci/logs/test.log "$VDIR/linux-test.log" 2>/dev/null || true
          fi
          if [ -f /tmp/ci-collected/ci-macos/macos-test.log ]; then
            cp /tmp/ci-collected/ci-macos/macos-test.log "$VDIR/macos-test.log"
          fi
          if [ -f /tmp/ci-collected/ci-windows/windows-test.log ]; then
            cp /tmp/ci-collected/ci-windows/windows-test.log "$VDIR/windows-test.log"
          fi

          # Retain at most the latest 3 version directories (previous 2 + current):
          ls -1dt ci/test-history/v* 2>/dev/null | tail -n +4 | xargs -r rm -rf

          git config user.name "archx-ci"
          git config user.email "ci@archx.local"
          git add ci/logs ci/out ci/test-history
          if git diff --cached --quiet; then
            echo "No new CI output to commit."
          else
            git commit -m "ci: update Linux/macOS/Windows logs and test history for ${GITHUB_SHA::7}"
            git push origin HEAD:"$GITHUB_REF_NAME" || echo "push failed (branch may have moved)"
          fi
