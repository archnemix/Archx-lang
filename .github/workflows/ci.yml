name: CI

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "Cargo.toml"
      - "ci/trigger"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Make sure clang is available
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Record toolchain
        run: |
          mkdir -p ci/logs ci/out
          {
            rustc --version
            cargo --version
            echo "clang path: $(command -v clang || echo missing)"
            clang --version || true
            ls -l target/release/archx || true
          } | tee ci/logs/toolchain.log

      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ci/logs/test.log

      - name: Build release
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ci/logs/build.log

      - name: Run examples
        run: |
          mkdir -p ci/out ci/logs
          set +e
          (
            fail=0

            echo "== emit-ir: hello =="
            ./target/release/archx examples/hello.archx --emit-ir > ci/out/hello.ll
            code=$?
            echo "exit=$code"
            [ "$code" -ne 0 ] && fail=1

            echo "== compile: hello =="
            ./target/release/archx examples/hello.archx -o /tmp/archx-hello > ci/logs/compile-hello.log 2>&1
            code=$?
            echo "exit=$code"
            cat ci/logs/compile-hello.log
            [ "$code" -ne 0 ] && fail=1

            echo "== run: hello =="
            if [ -x /tmp/archx-hello ]; then
              /tmp/archx-hello > ci/out/hello.txt
              code=$?
              echo "exit=$code"
              cat ci/out/hello.txt
              [ "$code" -ne 0 ] && fail=1
            else
              echo "binary missing"
              fail=1
            fi

            echo "== emit-ir: functions =="
            ./target/release/archx examples/functions.archx --emit-ir > ci/out/functions.ll
            code=$?
            echo "exit=$code"
            [ "$code" -ne 0 ] && fail=1

            echo "== compile: functions =="
            ./target/release/archx examples/functions.archx -o /tmp/archx-functions > ci/logs/compile-functions.log 2>&1
            code=$?
            echo "exit=$code"
            cat ci/logs/compile-functions.log
            [ "$code" -ne 0 ] && fail=1

            echo "== run: functions =="
            if [ -x /tmp/archx-functions ]; then
              /tmp/archx-functions > ci/out/functions.txt
              code=$?
              echo "exit=$code"
              cat ci/out/functions.txt
              [ "$code" -ne 0 ] && fail=1
            else
              echo "binary missing"
              fail=1
            fi

            exit "$fail"
          ) > ci/logs/examples.log 2>&1
          status=$?
          cat ci/logs/examples.log
          exit "$status"

      - name: Save CI output to the repo
        if: always()
        run: |
          git config user.name "archx-ci"
          git config user.email "ci@archx.local"
          git add ci/logs ci/out
          if git diff --cached --quiet; then
            echo "No new CI output to commit."
          else
            git commit -m "ci: update logs and outputs for ${GITHUB_SHA::7}"
            git push origin HEAD:"$GITHUB_REF_NAME" || echo "push failed (branch may have moved)"
          fi
